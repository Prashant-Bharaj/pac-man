name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build package
        run: make package

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: pkg/*.zip
          generate_release_notes: true
