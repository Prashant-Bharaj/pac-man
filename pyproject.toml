[project]
name = "pac-man"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "mazegenerator",
    "pydantic>=2.13.3",
    "pygame>=2.5.0",
]

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pyinstaller>=6.0.0",
    "pytest>=8.0.0",
]

[tool.uv.sources]
mazegenerator = { path = "mazegenerator-2.0.1-py3-none-any.whl" }
